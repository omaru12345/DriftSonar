name: DriftSonarApp Tests

on:
  push:
    branches: [main]
    paths:
      - 'DriftSonarApp/**'
      - 'DriftSonarCore/**'
      - '.github/workflows/app-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DriftSonarApp/**'
      - 'DriftSonarCore/**'
      - '.github/workflows/app-test.yml'

# Cancel superseded runs on the same ref so pushes don't stack up macOS minutes.
concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit / UI / Snapshot
    # macos-26 ships Xcode 26.2 (17C52) + the iOS 26.2 simulator with iPhone 17 —
    # exactly the environment the snapshot baselines were recorded on, so they match
    # at perceptualPrecision 0.98 instead of drifting across Xcode point releases.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the same Xcode the baselines were recorded with (26.2 / 17C52). A different
      # point release renders fonts slightly differently and fails the snapshot suite.
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Show toolchain
        run: xcodebuild -version

      # Cache resolved SwiftPM checkouts (SwiftLint plugin + swift-syntax,
      # swift-snapshot-testing). Keyed on the pins so a lockfile bump busts it.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('DriftSonarApp/DriftSonarApp/DriftSonarApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Runs DriftSonarAppTests (ViewModel unit) and DriftSonarAppUITests.
      #
      # Snapshot tests (*SnapshotTests) are skipped in CI: even on the identical Xcode 26.2
      # / iOS 26.2 simulator, the hosted runner renders text a hair differently from the
      # physical Mac the baselines were recorded on, so every snapshot fails at
      # perceptualPrecision 0.98 ("does not match reference"). Snapshot baselines are only
      # authoritative on the recording machine — they stay a LOCAL regression gate (run the
      # full `xcodebuild test` before pushing). CI gates the environment-portable layers.
      #
      # -retry-tests-on-failure tolerates the occasional UI-test flake (keyboard/animation
      # timing on a cold simulator) without turning a real regression green.
      - name: Run App tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DriftSonarApp/DriftSonarApp/DriftSonarApp.xcodeproj \
            -scheme DriftSonarApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES \
            -retry-tests-on-failure \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:DriftSonarAppTests/PostRowViewSnapshotTests \
            -skip-testing:DriftSonarAppTests/MessageBubbleSnapshotTests \
            -skip-testing:DriftSonarAppTests/EmptyTimelineViewSnapshotTests

      # Surface a per-target coverage summary in the job log (TASK-044 alignment).
      # Best-effort: never fail the job on a reporting hiccup.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          xcrun xccov view --report --only-targets TestResults.xcresult || \
            echo "coverage summary unavailable"

      # Keep the result bundle for post-mortem on failures (test logs, coverage, attachments).
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: TestResults.xcresult
          retention-days: 7
